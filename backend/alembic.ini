# Alembic configuration for EmiSaver
[alembic]
script_location = alembic
prepend_sys_path = .

# Template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path - will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# having their source .py files in the source tree.
# sourceless = false

# version path separator; As mentioned above, this is around whether to split
# version_locations entries into separate arguments for "heads" command.
# "version_locations" is treated as a single path
# the default value is "os", which uses os.pathsep
# version_path_separator = os

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# Database URL - overridden at runtime from app.config.settings
sqlalchemy.url = sqlite+aiosqlite:///./emisaver.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
